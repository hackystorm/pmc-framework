[package]
name = "pmc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Standalone binary for training, discovery and export."

[lib]
name = "pmc_cli"
path = "src/lib.rs"

[[bin]]
# `pmc-rust`, not `pmc`: the Python package installs a console script also
# called `pmc`, and two different commands with one name is a bug, not a
# convenience. The one a user types interactively is the Python CLI; this one
# is the no-Python, no-install path.
name = "pmc-rust"
path = "src/main.rs"

[dependencies]
pmc-core = { path = "../pmc-core" }
pmc-gguf = { path = "../pmc-gguf" }
pmc-train = { path = "../pmc-train" }
pmc-discovery = { path = "../pmc-discovery" }
