[workspace]
resolver = "2"
members = [
  "pmc-core",
  "pmc-gguf",
  "pmc-train",
  "pmc-ffi",
  "pmc-discovery",
  "pmc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.70"
repository = "https://github.com/hackystorm/pmc-framework"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
